      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

, "disabled": false, "hide_code": true}, "id": "Hstk", "name": "_"}, {"code": "", "code_hash": "edd86fccb7b5dfbce4d7ff7512cb0e4f", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "nWHF", "name": "_"}, {"code": "", "code_hash": "84e8bda9192c29bfc7887292bacbf0f9", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "iLit", "name": "_"}, {"code": "", "code_hash": "f9eb8700a31f891b85110fdd1f10dbbf", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "ZHCJ", "name": "_"}, {"code": "", "code_hash": "519909caf825941b1a9387179b4f0dad", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "ROlb", "name": "_"}, {"code": "", "code_hash": "a0918bedad3be7ecd644f8b191243430", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "qnkX", "name": "_"}], "metadata": {"marimo_version": "0.24.0"}, "version": "1"},
            "session": {"cells": [{"code_hash": "0fa5da6da9957621007deb30552f5d03", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"how-has-the-distribution-of-hoaxes-transformed-with-generative-ai\"\u003EHow has the distribution of hoaxes transformed with generative AI?\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EThis notebook compares the Indonesian fact-check corpus before and after the\npublic launch of ChatGPT on \u003Cstrong\u003E30 November 2022\u003C/strong\u003E, then profiles the small set\nof records explicitly linked to AI or deepfakes.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe comparison is descriptive. A temporal breakpoint does not show that\ngenerative AI caused a change: Google indexing, the configured queries,\npublisher coverage, missing dates, and changing events all shape this extract.\nThe source contains fact-checked claims with heterogeneous publisher ratings;\nit does not provide a universal binary \u201choax\u201d label.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4fefb460413c00c8a3b55ff50db579b1", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-method-and-analytical-grains\"\u003E1. Method and analytical grains\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Edata/google_fact_check_tool_id.parquet\u003C/code\u003E is read directly; this notebook makes\nno network calls and needs no cloud credentials.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETwo grains are used:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003Eone \u003Ccode\u003E(review_url, claim_text)\u003C/code\u003E record for prevalence and publisher coverage;\u003C/li\u003E\n\u003Cli\u003Eone \u003Ccode\u003E(era, claim_text)\u003C/code\u003E row for content analysis, so several publishers\n   reviewing the same wording do not overweight it.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe primary comparison uses balanced three-year windows around ChatGPT's\npublic launch:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPre:\u003C/strong\u003E 2019-11-30 through 2022-11-29;\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPost:\u003C/strong\u003E 2022-11-30 through 2025-11-29.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EA full-history comparison is retained as a sensitivity check. The whole\ncorpus supplies the pre/post distribution because this extract contains no\nrule-confirmed AI-linked record in the primary pre period. AI-linked records are\ntherefore treated as an emerging post-launch subset, not as a valid two-era\ndistribution of their own.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3ac95e05651dacc61f529bbee5269a2b", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0a2ed5decd1ba9712bf6dc67bee79287", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe extract contains \u003Cstrong\u003E11,787 keyword links\u003C/strong\u003E and \u003Cstrong\u003E7,678 reviewed-claim records\u003C/strong\u003E. The conservative AI filter retains \u003Cstrong\u003E15 records\u003C/strong\u003E from \u003Cstrong\u003E20 candidates\u003C/strong\u003E.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='bkHC-0' random-id='0b47414f-ba25-a774-cea9-11e3c3b0f387'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;frame\u0026#92;\u0026quot;:\u0026#92;\u0026quot;raw_frame\u0026#92;\u0026quot;,\u0026#92;\u0026quot;grain\u0026#92;\u0026quot;:\u0026#92;\u0026quot;keyword \u0026#92;\u0026#92;u00d7 reviewed claim\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:11787,\u0026#92;\u0026quot;purpose\u0026#92;\u0026quot;:\u0026#92;\u0026quot;source and retrieval audit\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;frame\u0026#92;\u0026quot;:\u0026#92;\u0026quot;review_frame\u0026#92;\u0026quot;,\u0026#92;\u0026quot;grain\u0026#92;\u0026quot;:\u0026#92;\u0026quot;distinct (review URL, claim text)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:7678,\u0026#92;\u0026quot;purpose\u0026#92;\u0026quot;:\u0026#92;\u0026quot;prevalence and publishers\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;frame\u0026#92;\u0026quot;:\u0026#92;\u0026quot;content_frame\u0026#92;\u0026quot;,\u0026#92;\u0026quot;grain\u0026#92;\u0026quot;:\u0026#92;\u0026quot;distinct (comparison era, claim text)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:4565,\u0026#92;\u0026quot;purpose\u0026#92;\u0026quot;:\u0026#92;\u0026quot;modality, themes, and language\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;frame\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ai_linked_frame\u0026#92;\u0026quot;,\u0026#92;\u0026quot;grain\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed AI-linked reviewed claim\u0026#92;\u0026quot;,\u0026#92;\u0026quot;rows\u0026#92;\u0026quot;:15,\u0026#92;\u0026quot;purpose\u0026#92;\u0026quot;:\u0026#92;\u0026quot;AI emergence and audit\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='4' data-total-columns='4' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='4' data-field-types='[[\u0026quot;frame\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;grain\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;rows\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]],[\u0026quot;purpose\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"claim-date-eligibility\"\u003EClaim-date eligibility\u003C/h3\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='bkHC-1' random-id='21c42661-0b65-5a8f-2f16-d1bb05e57444'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;date status\u0026#92;\u0026quot;:\u0026#92;\u0026quot;parseable claim date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;reviewed claims\u0026#92;\u0026quot;:6302,\u0026#92;\u0026quot;temporal treatment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;eligible for full-history comparison\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;date status\u0026#92;\u0026quot;:\u0026#92;\u0026quot;missing claim date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;reviewed claims\u0026#92;\u0026quot;:1376,\u0026#92;\u0026quot;temporal treatment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;retained for audit; excluded from time comparisons\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;date status\u0026#92;\u0026quot;:\u0026#92;\u0026quot;unparseable non-null claim date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;reviewed claims\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;temporal treatment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;retained for audit; excluded from time comparisons\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;date status\u0026#92;\u0026quot;:\u0026#92;\u0026quot;inside balanced windows\u0026#92;\u0026quot;,\u0026#92;\u0026quot;reviewed claims\u0026#92;\u0026quot;:4592,\u0026#92;\u0026quot;temporal treatment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;primary comparison denominator\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;date status\u0026#92;\u0026quot;:\u0026#92;\u0026quot;parseable but outside balanced windows\u0026#92;\u0026quot;,\u0026#92;\u0026quot;reviewed claims\u0026#92;\u0026quot;:1710,\u0026#92;\u0026quot;temporal treatment\u0026#92;\u0026quot;:\u0026#92;\u0026quot;full-history sensitivity only\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='5' data-total-columns='3' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='5' data-field-types='[[\u0026quot;date status\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;reviewed claims\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]],[\u0026quot;temporal treatment\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "6e52c9cf392faeacf912b543a09bd438", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"2-what-counts-as-ai-linked\"\u003E2. What counts as AI-linked?\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EIdentification is deliberately conservative. A record must first have been\nretrieved by the configured \u003Ccode\u003Eai\u003C/code\u003E or \u003Ccode\u003Edeepfake\u003C/code\u003E query and must then contain an\nexplicit AI term in its claim text or review title. Query candidates without\ntextual confirmation are rejected; records never retrieved by either query\ncannot enter the subset.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u201cRule-confirmed\u201d does not mean manually adjudicated. Names such as \u003Ccode\u003EGemini\u003C/code\u003E,\n\u003Ccode\u003ESora\u003C/code\u003E, or \u003Ccode\u003EAi\u003C/code\u003E can still be ambiguous even after query filtering. The rule\nfavors precision over recall, and every matched term is retained so possible\nfalse positives can be inspected rather than hidden.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d0ada9e9967d9e17253e15cfb2aba38c", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eThe strict filter finds \u0026#92;u003cstrong\u0026#92;u003e0 rule-confirmed AI-linked records before the breakpoint\u0026#92;u003c/strong\u0026#92;u003e and \u0026#92;u003cstrong\u0026#92;u003e7 after it\u0026#92;u003c/strong\u0026#92;u003e inside the balanced windows. With no pre-period AI-linked baseline, their own content distribution cannot be compared across eras; the corpus-wide comparison below is used instead.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;' data-title='\u0026quot;Why the scope changed to corpus-wide pre/post\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003Cmarimo-ui-element object-id='PKri-0' random-id='d7dcda18-c7b2-bfab-b2e4-baa02112dfc5'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ai/deepfake query candidates\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:20},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed by explicit text\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:15},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rejected candidates\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:5},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed with parseable claim date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:13},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed without parseable claim date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:2},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed in primary pre window\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:0},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed in primary post window\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:7}]\u0026quot;' data-total-rows='7' data-total-columns='2' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='7' data-field-types='[[\u0026quot;stage\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;records\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-elem rong\u003Eall\u003C/strong\u003E unique claim texts, the largest mentioned-format movement is\n\u003Cstrong\u003Etoward unspecified\u003C/strong\u003E\n(\u003Cstrong\u003E+12.47 pp\u003C/strong\u003E; distributional JSD\n\u003Cstrong\u003E0.0259\u003C/strong\u003E). The strongest co-theme rise is\n\u003Cstrong\u003Escams/economy\u003C/strong\u003E (\u003Cstrong\u003E+12.31 pp\u003C/strong\u003E) and the\nstrongest decline is \u003Cstrong\u003Etechnology/media\u003C/strong\u003E\n(\u003Cstrong\u003E-21.00 pp\u003C/strong\u003E). In claim wording,\n\u003Cstrong\u003Eanies\u003C/strong\u003E rises most (\u003Cstrong\u003E+5.49 pp\u003C/strong\u003E)\nwhile \u003Cstrong\u003Ecovid-19\u003C/strong\u003E declines most\n(\u003Cstrong\u003E-15.78 pp\u003C/strong\u003E). Full-history sensitivity\n\u003Cstrong\u003Esupports the same direction\u003C/strong\u003E (+0.308 pp).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInterpretation:\u003C/strong\u003E the corpus after 2022-11-30 contains a small,\nrule-confirmed AI-linked subset and a measurably different content mix. The analysis\ncannot attribute those broader changes to generative AI. Google indexing,\nfixed query vocabulary, publisher mix (largest shift:\n\u003Ccode\u003Etempo.co\u003C/code\u003E at\n-17.12 pp), missing dates,\nretrospective query matching, current events, and rule-based AI confirmation\nall limit the conclusion. Publisher ratings are heterogeneous and are not\ncollapsed into a universal true/false or hoax label.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eThe CSV embeds the conservative AI classification, matched terms, modality, themes, dates, publisher fields, and source identifiers. It was generated from \u0026#92;u003ccode
