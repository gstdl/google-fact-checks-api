      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

 "disabled": false, "hide_code": false}, "id": "Hstk", "name": "_"}, {"code": "", "code_hash": "4162cd326198d03f4aa283f0a1b63095", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "nWHF", "name": "_"}, {"code": "", "code_hash": "f59b10c2e3b63ce83ccefea07409c41f", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "iLit", "name": "_"}, {"code": "", "code_hash": "ff2e354ccb1dda30fba421c0d4cd86d5", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "ZHCJ", "name": "_"}, {"code": "", "code_hash": "4d4bd7c3d4dc5d148f412bdfcf4adda1", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "ROlb", "name": "_"}, {"code": "", "code_hash": "e573fe32404200fc3f09d5542a33e15d", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "qnkX", "name": "_"}, {"code": "", "code_hash": "bf82cce2930201bd97f1fb1fbdf9c262", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "TqIu", "name": "_"}, {"code": "", "code_hash": "1e9286d6f5ec3bac7f3d270822f6f947", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Vxnm", "name": "_"}], "metadata": {"marimo_version": "0.24.0"}, "version": "1"},
            "session": {"cells": [{"code_hash": "0fa5da6da9957621007deb30552f5d03", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"how-has-the-distribution-of-hoaxes-transformed-with-generative-ai\"\u003EHow has the distribution of hoaxes transformed with generative AI?\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EThis notebook compares the Indonesian fact-check corpus before and after the\npublic launch of ChatGPT on \u003Cstrong\u003E30 November 2022\u003C/strong\u003E, then profiles the small set\nof records explicitly linked to AI or deepfakes.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe comparison is descriptive. A temporal breakpoint does not show that\ngenerative AI caused a change: Google indexing, the configured queries,\npublisher coverage, missing dates, and changing events all shape this extract.\nThe source contains fact-checked claims with heterogeneous publisher ratings;\nit does not provide a universal binary \u201choax\u201d label.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2f08ba89ad022df33ffb5c2f8a2c898b", "console": [], "id": "MJUe", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-direct-answer\"\u003E1. Direct answer\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"#2-how-ai-linked-records-were-identified\"\u003EIdentification\u003C/a\u003E \u00b7\n\u003Ca href=\"#3-when-do-ai-linked-records-emerge\"\u003EEmergence timeline\u003C/a\u003E \u00b7\n\u003Ca href=\"#4-what-else-changed-across-the-whole-corpus\"\u003ECorpus-wide changes\u003C/a\u003E \u00b7\n\u003Ca href=\"#5-methods-limitations-records-and-download\"\u003EMethods and records\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: wrap;gap: 0.5rem'\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;21\u0026quot;' data-label='\u0026quot;AI/deepfake candidates\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;16\u0026quot;' data-label='\u0026quot;Rule-confirmed records\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;0\u0026quot;' data-label='\u0026quot;Primary pre period\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;14\u0026quot;' data-label='\u0026quot;Primary post period\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cmarimo-stat data-value='\u0026quot;6,367\u0026quot;' data-label='\u0026quot;Records with claim dates\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E\u003C/div\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eRule-confirmed AI-linked reviewed claims move from \u0026#92;u003cstrong\u0026#92;u003e0 of 2,094 (0.000%)\u0026#92;u003c/strong\u0026#92;u003e before the breakpoint to \u0026#92;u003cstrong\u0026#92;u003e14 of 4,273 (0.328%)\u0026#92;u003c/strong\u0026#92;u003e after it, a \u0026#92;u003cstrong\u0026#92;u003e+0.328 percentage-point\u0026#92;u003c/strong\u0026#92;u003e change. The zero pre-period numerator supports observed emergence, not a finite growth ratio.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;info\u0026quot;' data-title='\u0026quot;Observed emergence across full dated history\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EAcross all unique claim texts, the largest mentioned-format movement is \u003Cstrong\u003Etoward unspecified\u003C/strong\u003E (\u003Cstrong\u003E+8.74 pp\u003C/strong\u003E; JSD \u003Cstrong\u003E0.0206\u003C/strong\u003E). The strongest co-theme rise is \u003Cstrong\u003Escams/economy\u003C/strong\u003E (\u003Cstrong\u003E+17.70 pp\u003C/strong\u003E) and the strongest decline is \u003Cstrong\u003Etechnology/media\u003C/strong\u003E (\u003Cstrong\u003E-20.75 pp\u003C/strong\u003E). In wording, \u003Cstrong\u003Epenipuan\u003C/strong\u003E rises most and \u003Cstrong\u003Ecovid-19\u003C/strong\u003E declines most. Balanced-window sensitivity \u003Cstrong\u003Esupports the same direction\u003C/strong\u003E (+0.267 pp).\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eThe analysis cannot attribute broader post-2022-11-30 corpus changes to generative AI. Google indexing, fixed queries, missing dates, current events, and publisher composition\u2014including the largest shift at \u0026#92;u003ccode\u0026#92;u003etempo.co\u0026#92;u003c/code\u0026#92;u003e (-20.77 pp)\u2014all shape the comparison.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;' data-title='\u0026quot;Temporal association is not a causal effect\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "cc3d02b8d5cd0673cb289e8a7dc112c5", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "12eab3668af8c59d63f647f347d5ea17", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "922efa37e03a5f72599e6c3aedccc8f8", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "50c766a0949daf03eb8cbfca8a4679db", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"2-how-ai-linked-records-were-identified\"\u003E2. How AI-linked records were identified\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EIdentification is deliberately conservative. A record must first have been\nretrieved by the configured \u003Ccode\u003Eai\u003C/code\u003E or \u003Ccode\u003Edeepfake\u003C/code\u003E query and must then contain an\nexplicit AI term in its claim text or review title. Query candidates without\ntextual confirmation are rejected; records never retrieved by either query\ncannot enter the subset.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u201cRule-confirmed\u201d does not mean manually adjudicated. Names such as \u003Ccode\u003EGemini\u003C/code\u003E,\n\u003Ccode\u003ESora\u003C/code\u003E, or \u003Ccode\u003EAi\u003C/code\u003E can still be ambiguous even after query filtering. The rule\nfavors precision over recall, and every matched term is retained so possible\nfalse positives can be inspected rather than hidden.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "35f4bd86abae3d38fe01cf500e736348", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eThe strict filter finds \u0026#92;u003cstrong\u0026#92;u003e0 rule-confirmed AI-linked dated records before the breakpoint\u0026#92;u003c/strong\u0026#92;u003e and \u0026#92;u003cstrong\u0026#92;u003e14 after it\u0026#92;u003c/strong\u0026#92;u003e across the full dated history. With no pre-period AI-linked baseline, their own content distribution cannot be compared across eras; the corpus-wide comparison below is used instead.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;' data-title='\u0026quot;Why the scope changed to corpus-wide pre/post\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003Cmarimo-ui-element object-id='Xref-0' random-id='8fa8b4fd-e633-1a5d-fe95-c32e172f392e'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ai/deepfake query candidates\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:21},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed by explicit text\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:16},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rejected candidates\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:5},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed with parseable claim date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:14},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed without parseable claim date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:2},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed in primary pre period\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:0},{\u0026#92;\u0026quot;stage\u0026#92;\u0026quot;:\u0026#92;\u0026quot;rule-confirmed in primary post period\u0026#92;\u0026quot;,\u0026#92;\u0026quot;records\u0026#92;\u0026quot;:14}]\u0026quot;' data-total-rows='7' data-total-columns='2' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='7' data-field-types='[[\u0026quot;stage\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;records\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;i64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eConfirmation dictionary and ambiguous terms\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eRule-confirmed AI-linked records (16)\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eRejected keyword candidates (5)\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false'\u003E\u003Cdiv\u003E\u003Cmarimo-ui-element object-id='Xref-1' random-id='2f3ca73e-faa7-ef6c-4251-bfd170680edd'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;confirmation_term\u0026#92;\u0026quot;:\u0026#92;\u0026quot;standalone AI\u0026#92;\u0026quot;,\u0026#92;\u0026quot;regular_expression\u0026#92;\u0026quot;:\u0026#92;\u0026quot;(?i)(?\u0026#92;u003c![\u0026#92;\u0026#92;\u0026#92;\u0026#92;w])ai(?![\u0026#92;\u0026#92;\u0026#92;\u0026#92;w])\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;confirmation_term\u0026#92;\u0026quot;:\u0026#92;\u0026quot;deepfake\u0026#92;\u0026quot;,\u0026#92;\u0026quot;regular_expression\u0026#92;\u0026quot;:\u0026#92;\u0026quot;(?i)\u0026#92;\u0026#92;\u0026#92;\u0026#92;bdeep[\u0026#92;\u0026#92;\u0026#92;\u0026#92;s-]?fake\u0026#92;\u0026#92;\u0026#92;\u0026#92;b\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;confirmation_term\u0026#92;\u0026quot;:\u0026#92;\u0026quot;kecerdasan buatan\u0026#92;\u0026quot;,\u0026#92;\u0026quot;regular_expression\u0026#92;\u0026quot;:\u0026#92;\u0026quot;(?i)\u0026#92;\u0026#92;\u0026#92;\u0026#92;bkecerdasan\u0026#92;\u0026#92;\u0026#92;\u0026#92;s+buatan\u0026#92;\u0026#92;\u0026#92;\u0026#92;b\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;confirmation_term\u0026#92;\u0026quot;:\u0026#92;\u0026quot;artificial intelligence\u0026#92;\u0026quot;,\u0026#92;\u0026quot;regular_expression\u0026#92;\u0026quot;:\u0026#92;\u0026quot;(?i)\u0026#92;\u0026#92;\u0026#92;\u0026#92;bartificial\u0026#92;\u0026#92;\u0026#92;\u0026#92;s+intelligence\u0026#92;\u0026#92;\u0026#92;\u0 tebook makes\nno network calls and needs no cloud credentials.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETwo grains are used:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003Eone \u003Ccode\u003E(review_url, claim_text)\u003C/code\u003E record for prevalence and publisher coverage;\u003C/li\u003E\n\u003Cli\u003Eone \u003Ccode\u003E(era, claim_text)\u003C/code\u003E row for content analysis, so several publishers\n   reviewing the same wording do not overweight it.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe primary comparison uses every reviewed claim with a parseable claim date,\nsplit at ChatGPT's public launch:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPre:\u003C/strong\u003E all dated records before 2022-11-30;\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPost:\u003C/strong\u003E all dated records from 2022-11-30 onward.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EBecause the available pre- and post-launch histories have unequal durations,\nbalanced three-year windows are retained as a sensitivity check. The full\ndated corpus supplies the primary pre/post distribution because this extract\ncontains no rule-confirmed AI-linked record before launch. AI-linked records\nare therefore treated as an emerging post-launch subset, not as a valid\ntwo-era distribution of their own.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe extract contains \u003Cstrong\u003E11,888 keyword links\u003C/strong\u003E and \u003Cstrong\u003E7,746 reviewed-claim records\u003C/strong\u003E. The conservative AI filter retains \u003Cstrong\u003E16 records\u003C/strong\u003E from \u003Cstrong\u003E21 candidates\u003C/strong\u003E.\u003C/
